<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7aa0f4"/>
      <stop offset="1" stop-color="#4670e0"/>
    </linearGradient>
    <linearGradient id="bgEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".32"/>
      <stop offset=".35" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#1f3fa8" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0f0f0"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfdfd"/>
      <stop offset="1" stop-color="#cfd3da"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f98f2"/>
      <stop offset="1" stop-color="#3f68e2"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4d4d4"/>
      <stop offset="1" stop-color="#e6e6e6"/>
    </linearGradient>
    <linearGradient id="plane1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3ebff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#14308c" flood-opacity=".38"/>
    </filter>
    <filter id="sh2" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f2670" flood-opacity=".5"/>
    </filter>
    <clipPath id="sq"><rect width="1024" height="1024" rx="226"/></clipPath>
  </defs>

  <!-- 底板 -->
  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#bgEdge)"/>
  </g>
  <rect x="3" y="3" width="1018" height="1018" rx="223" fill="none" stroke="#2c53c9" stroke-opacity=".7" stroke-width="3"/>
  <rect x="9" y="9" width="1006" height="1006" rx="217" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="3"/>

  <!-- 网页纸 -->
  <g filter="url(#sh)">
    <path d="M262 226 a40 40 0 0 1 40 -40 H606 L762 342 V784 a40 40 0 0 1 -40 40 H302 a40 40 0 0 1 -40 -40 Z" fill="url(#paper)" stroke="#d2d2d2" stroke-width="3"/>
  </g>
  <!-- 折角 -->
  <path d="M606 186 V302 a40 40 0 0 0 40 40 H762 Z" fill="url(#fold)" stroke="#c4c8d0" stroke-width="3" stroke-linejoin="round"/>
  <path d="M608 190 V300 a38 38 0 0 0 38 38 H756" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>

  <!-- 标题条(蓝) -->
  <rect x="320" y="258" width="190" height="36" rx="18" fill="#5b87eb"/>
  <rect x="320" y="258" width="190" height="36" rx="18" fill="none" stroke="#3f68e2" stroke-width="2"/>
  <!-- 内凹正文条 -->
  <g>
    <rect x="320" y="366" width="380" height="28" rx="14" fill="url(#bar)"/>
    <rect x="320" y="430" width="380" height="28" rx="14" fill="url(#bar)"/>
    <rect x="320" y="494" width="300" height="28" rx="14" fill="url(#bar)"/>
    <rect x="320" y="558" width="340" height="28" rx="14" fill="url(#bar)"/>
    <rect x="320" y="622" width="170" height="28" rx="14" fill="url(#bar)"/>
    <g fill="none" stroke="#c4c4c4" stroke-width="2">
      <rect x="320" y="366" width="380" height="28" rx="14"/>
      <rect x="320" y="430" width="380" height="28" rx="14"/>
      <rect x="320" y="494" width="300" height="28" rx="14"/>
      <rect x="320" y="558" width="340" height="28" rx="14"/>
      <rect x="320" y="622" width="170" height="28" rx="14"/>
    </g>
  </g>

  <!-- 领航按钮 -->
  <g filter="url(#sh2)">
    <circle cx="690" cy="742" r="172" fill="#fff"/>
  </g>
  <circle cx="690" cy="742" r="172" fill="none" stroke="#c9d6f5" stroke-width="3"/>
  <circle cx="690" cy="742" r="150" fill="url(#badge)" stroke="#3558c9" stroke-width="3"/>
  <path d="M690 594 a148 148 0 0 1 104 43 a170 170 0 0 0 -208 0 a148 148 0 0 1 104 -43Z" fill="#fff" fill-opacity=".35"/>

  <!-- 纸飞机 -->
  <g transform="translate(690 742) scale(.66) translate(-284 -244)" stroke-linejoin="round" stroke-linecap="round">
    <path d="M460 128 L108 243 L202 280 L213 360 L247 322 L330 358 Z" fill="#fff"/>
    <path d="M460 128 L202 280 L213 360 L247 322 Z M460 128 L247 322" fill="none" stroke="#4670e0" stroke-opacity=".6" stroke-width="7"/>
  </g>
</svg>
